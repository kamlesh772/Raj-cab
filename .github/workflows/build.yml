name: Build Raj Cab APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Build Web
        run: |
          npm install
          npm run build

      - name: Setup Capacitor & Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Raj Cab" com.rajcab.app --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Fix Kotlin Duplicate Classes Conflict
        run: |
          # gradle.properties में डुप्लीकेट क्लास एरर को बायपास करने का नियम जोड़ें
          echo "android.enableJetifier=true" >> android/gradle.properties
          
          # app/build.gradle में डुप्लीकेट कॉटलिन लाइब्रेरी एक्सक्लूड करें
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RajCab-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
